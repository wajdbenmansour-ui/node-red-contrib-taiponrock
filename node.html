
<script type="text/javascript">
    RED.nodes.registerType('wajd-node', {
        category: 'function',
        color: '#a6bbcf',
        defaults: {
            name: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "file.png",
        label: function() {
            return this.name || "wajd-node";
        }
    });
</script>

<script type="text/html" data-template-name="wajd-node">
    <div class="form-row">
        <label for="node-input-name">
            <i class="icon-tag"></i> Name
        </label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="wajd-node">
    <p>
        A custom node that converts the message payload
        into lowercase characters.
    </p>
</script>
